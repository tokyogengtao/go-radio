<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Music Player</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .radio-case { background: #1e293b; padding: 25px; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 340px; }
        .lang-switcher { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 15px; }
        .lang-btn { background: #334155; border: 1px solid #475569; color: #94a3b8; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .lang-btn.active { color: #38bdf8; border-color: #38bdf8; }
        .screen { background: #0f172a; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; border: 1px solid #334155; min-height: 50px; }
        #status { color: #38bdf8; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .btn { background: #334155; border: none; color: #f1f5f9; padding: 15px; border-radius: 12px; cursor: pointer; font-size: 14px; text-align: left; display: flex; justify-content: space-between; }
        .btn:hover { background: #475569; }
        .btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
    </style>
</head>
<body>

<div class="radio-case">
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLang('zh', this)">中文</button>
        <button class="lang-btn" onclick="setLang('en', this)">EN</button>
        <button class="lang-btn" onclick="setLang('jp', this)">JP</button>
    </div>
    <div class="screen"><div id="status">READY</div></div>
    <div class="grid" id="buttonGrid"></div>
</div>

<audio id="audio" crossorigin="anonymous"></audio>

<script>
    const audio = document.getElementById('audio');
    const status = document.getElementById('status');
    const buttonGrid = document.getElementById('buttonGrid');
    let currentLang = 'zh';
    let currentUrl = '';

    const i18n = {
        zh: { playing: "正在播放: ", off: "就绪", stations: ["中文流行 (C-Pop)", "中文经典 (Oldies)", "日文流行 (J-Pop)", "动漫音乐 (Anime)", "英文流行 (US Hits)", "爵士乐 (Global Jazz)", "Lo-Fi 学习音乐"] },
        en: { playing: "PLAYING: ", off: "READY", stations: ["Chinese Hits", "Chinese Classics", "J-Pop Music", "Anime Music", "English Top 40", "Global Jazz", "Lo-Fi Study"] },
        jp: { playing: "再生中: ", off: "待機中", stations: ["中国語ポップ", "中国語名曲", "J-Pop 音楽", "アニメ音楽", "洋楽ヒット", "ジャズ音楽", "Lo-Fi 音楽"] }
    };

    // 这些 URL 是目前全球最稳定的 HTTPS 音乐流
    const urls = [
        'https://v6.p3stats.com/proxy/asianbeat/stream',       // 中文流行
        'https://stream.rcast.net/63560',                      // 中文经典
        'https://listen.moe/stream',                           // 日文流行 (你测试成功的)
        'https://cast.animu.fm:6969/tokyo',                    // 动漫音乐
        'https://ice6.securenetsystems.net/KHOP',              // 英文流行
        'https://tdmg.it/VirginRadio.mp3',                     // 英文经典/摇滚
        'https://streaming.shoutcast.com/80s70s_Lofi'          // Lo-Fi
    ];

    function renderButtons() {
        buttonGrid.innerHTML = '';
        i18n[currentLang].stations.forEach((name, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerHTML = `<span>${name}</span><span>▶</span>`;
            if (urls[index] === currentUrl && !audio.paused) btn.classList.add('active');
            btn.onclick = () => play(urls[index], name, btn);
            buttonGrid.appendChild(btn);
        });
    }

    function play(url, name, btn) {
        if (currentUrl === url && !audio.paused) {
            audio.pause();
            status.innerText = i18n[currentLang].off;
            renderButtons();
            return;
        }
        currentUrl = url;
        status.innerText = "LOADING...";
        audio.src = url;
        audio.play().then(() => {
            status.innerText = i18n[currentLang].playing + name;
            renderButtons();
        }).catch(() => {
            status.innerText = "ERROR - TRY ANOTHER";
        });
    }

    function setLang(lang, el) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        renderButtons();
    }

    renderButtons();
</script>
</body>
</html>
